<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#004CBC">
  <title>Сканер Кондратьева</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <!-- Официальный логотип ВТБ (белый на прозрачном фоне) -->
    <img src="vtb_logo.png" alt="ВТБ" class="vtb-logo">
    <h1>Сканер Кондратьева</h1>
    <p class="subtitle">Сфотографируйте бумажную корреспонденцию для автоматического распознавания,
      автоматической регистрации в СДО и автоматического формирования необходимого маршрута
      в зависимости от типа и контекста документа</p>
    <p class="version" id="app-version"></p>
  </header>

  <main>
    <!-- Шаг 1: снимок -->
    <section class="card capture">
      <label class="btn btn-primary" for="input-camera">📷 Сделать фото</label>
      <input type="file" id="input-camera" accept="image/*" capture="environment" hidden>

      <label class="btn btn-secondary" for="input-gallery">🖼 Выбрать из галереи</label>
      <input type="file" id="input-gallery" accept="image/*" hidden>
    </section>

    <!-- Предпросмотр снятого фото -->
    <section class="card preview" id="preview-section" hidden>
      <h2><span class="step-num">1</span>Фото</h2>
      <img id="preview-img" alt="Предпросмотр фото">
      <button id="btn-retake" class="btn btn-secondary">↺ Другое фото</button>
    </section>

    <!-- Шаг 2: распознавание текста -->
    <section class="card recognize" id="recognize-section" hidden>
      <h2><span class="step-num">2</span>Распознавание</h2>
      <button id="btn-recognize" class="btn btn-primary">🔍 Распознать текст</button>
      <div class="progress" id="progress-box" hidden>
        <div class="progress-bar" id="progress-bar"><div id="progress-fill"></div></div>
        <p id="progress-text">Подготовка…</p>
      </div>
    </section>

    <!-- Шаг 3: результат -->
    <section class="card result" id="result-section" hidden>
      <h2><span class="step-num">3</span>Текст</h2>
      <textarea id="result-text" rows="12"
        placeholder="Здесь появится распознанный текст — его можно поправить руками"></textarea>
    </section>
  </main>


  <script src="app.js"></script>
</body>
</html>
